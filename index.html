<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Samax - La tua radio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:Arial, sans-serif;text-align:center}
  .hero{
    min-height:100vh;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:20px;
    background: radial-gradient(circle at 50% 30%, #e81e4d 0%, #7a0f28 35%, #000 75%);
  }
  .logo{
    font-size:52px;font-weight:900;letter-spacing:2px;line-height:1;
  }
  .logo span{color:#e81e4d}
  .slogan{margin-top:10px;font-size:18px;opacity:.9}
  .live{
    margin-top:18px;background:#ff0033;color:#fff;
    padding:8px 18px;border-radius:30px;font-weight:bold;font-size:14px;
    display:inline-block;
  }
  .live i{display:inline-block;width:10px;height:10px;background:#fff;border-radius:50%;margin-right:8px;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .player-box{
    margin-top:25px;background:#111;border:2px solid #e81e4d;
    border-radius:20px;padding:20px;width:100%;max-width:420px;
    box-shadow:0 0 30px rgba(232,30,77,.5);
  }
  .player-box h2{font-size:20px;margin-bottom:12px}
  .player-box p{font-size:14px;opacity:.8;margin-bottom:15px}
  .cstrEmbed{width:100% !important}
  .btn{
    display:block;margin-top:18px;background:#fff;color:#000;
    padding:14px;border-radius:50px;font-weight:bold;text-decoration:none;font-size:16px;
  }
  .btn2{
    display:block;margin-top:10px;background:transparent;color:#fff;
    border:1px solid #fff;padding:12px;border-radius:50px;text-decoration:none;font-size:14px;
  }
  .footer{margin-top:25px;font-size:12px;opacity:.6}
</style>
</head>
<body>

<div class="hero">
  <div class="logo">RADIO<br><span>SAMAX</span></div>
  <div class="slogan">La tua musica, la tua radio. Ovunque.</div>
  <div class="live"><i></i> ON AIR - IN DIRETTA</div>

  <div class="player-box">
    <h2>▶ Ascolta Ora</h2>
    <p>Premi PLAY qui sotto e parte Radio Samax</p>

    <!-- PLAYER UFFICIALE CASTER - QUELLO CHE SUONA -->
    <div data-type="newStreamPlayer" data-publicToken="29545c38-6a9d-4769-ba93-474128dc1abc" data-theme="dark" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed"><a href="https://www.caster.fm">Shoutcast Hosting</a></div><script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>

  </div>

  <a class="btn" href="https://radiosamx.ismyradio.com" target="_blank">Apri Sito Ufficiale su Caster</a>
  <a class="btn2" href="https://radiosamx.ismyradio.com" target="_blank">radiosamx.ismyradio.com</a>

  <div class="footer">© 2026 Radio Samax - Powered by Caster.fm</div>
</div>

</body>
</html>
