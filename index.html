<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO ASTREA - In Diretta</title>
<style>
  body { background: #111; color: white; font-family: Arial, sans-serif; text-align: center; padding: 30px; }
  .box { background: #222; border-radius: 20px; padding: 30px; max-width: 500px; margin: auto; }
  h1 { color: #ff2d55; font-size: 32px; margin: 10px 0; }
  .live { background: red; color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; display: inline-block; }
  button { background: #ff2d55; color: white; border: none; padding: 15px 30px; font-size: 20px; border-radius: 50px; cursor: pointer; margin: 20px 0; }
  audio { width: 100%; margin-top: 15px; }
  .status { margin-top: 15px; color: #00ff88; }
</style>
</head>
<body>

<div class="box">
  <span class="live">● LIVE</span>
  <h1>RADIO ASTREA</h1>
  <p>La tua radio in diretta</p>

  <button onclick="playRadio()">▶️ ASCOLTA ORA</button>

  <audio id="radio" controls>
    <source src="https://s1.free-shoutcast.com/stream/18404" type="audio/mpeg">
  </audio>

  <p class="status" id="status">Premi ASCOLTA per sentire la diretta</p>
  <p style="font-size:13px; color:#aaa;">Se non parte subito, premi Play nel lettore qui sopra</p>
</div>

<script>
function playRadio() {
  var a = document.getElementById('radio');
  a.play();
  document.getElementById('status').innerText = "Stai ascoltando RADIO ASTREA 🔴";
}
</script>

</body>
</html>
