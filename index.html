<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBX - Rubrica</title>
<style>
body{font-family:Arial;background:#0b2b1a;color:white;text-align:center;padding:20px;margin:0}
.box{background:white;color:black;max-width:480px;margin:15px auto;padding:20px;border-radius:12px}
input{width:90%;padding:11px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:95%;padding:12px;background:#0a7a3c;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px;margin:5px 0}
button.elimina{background:#c62828;width:auto;padding:6px 10px;font-size:13px}
.hidden{display:none}
.contatto{background:#f1f1f1;padding:12px;margin:8px 0;border-radius:10px;text-align:left}
.contatto b{font-size:17px}
.contatto small{color:#555}
</style>
</head>
<body>
<h1>RBX DA VERDE</h1>
<p>RUBRICA - Solo Sito, No Database</p>

<div class="box" id="loginBox">
<h2>AMMINISTRATORE</h2>
<input id="pass1" type="password" placeholder="Password Admin">
<input id="pass2" type="password" placeholder="Ripeti Password">
<button onclick="entra()">ENTRA</button>
<p id="msg"></p>
</div>

<div class="box hidden" id="adminBox">
<h2>Rubrica RBX</h2>
<p>Sei dentro come Admin ✅</p>
<input id="cerca" placeholder="🔍 Cerca nome..." oninput="mostra()">
<input id="nome" placeholder="Nome utente">
<input id="telefono" placeholder="Telefono / Numero">
<input id="nota" placeholder="Nota (es. ruolo, zona)">
<button onclick="creaUtente()">➕ CREA UTENTE / CONTATTO</button>
<div id="lista"></div>
<button onclick="esci()" style="background:#333">ESCI</button>
</div>

<script>
var PASSWORD = "astrea.astrea2423";
function entra(){
  var p1=document.getElementById('pass1').value;
  var p2=document.getElementById('pass2').value;
  if(p1===PASSWORD && p2===PASSWORD){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminBox').classList.remove('hidden');
    mostra();
  } else {
    document.getElementById('msg').innerText="Password sbagliata. Scrivi astrea.astrea2423 in tutte e 2 le caselle";
  }
}
function getLista(){ return JSON.parse(localStorage.getItem('rubrica_rbx')||"[]"); }
function setLista(l){ localStorage.setItem('rubrica_rbx', JSON.stringify(l)); }
function creaUtente(){
  var nome=document.getElementById('nome').value.trim();
  var tel=document.getElementById('telefono').value.trim();
  var nota=document.getElementById('nota').value.trim();
  if(!nome) return alert("Scrivi un nome");
  var lista=getLista();
  lista.unshift({nome:nome, telefono:tel, nota:nota});
  setLista(lista);
  document.getElementById('nome').value="";
  document.getElementById('telefono').value="";
  document.getElementById('nota').value="";
  mostra();
}
function elimina(i){
  var lista=getLista();
  lista.splice(i,1);
  setLista(lista);
  mostra();
}
function mostra(){
  var lista=getLista();
  var q=(document.getElementById('cerca').value||"").toLowerCase();
  var html="";
  lista.forEach(function(c, i){
    if(q && c.nome.toLowerCase().indexOf(q)===-1) return;
    html+="<div class='contatto'><b>👤 "+c.nome+"</b><br><small>📞 "+(c.telefono||"-")+"<br>📝 "+(c.nota||"-")+"</small><br><button class='elimina' onclick='elimina("+i+")'>Elimina</button></div>";
  });
  document.getElementById('lista').innerHTML= html || "<p>Nessun contatto. Creane uno sopra.</p>";
}
function esci(){location.reload();}
</script>
</body>
</html>
