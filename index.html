<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadioSamax - Sama X Time</title>
<style>
  body{margin:0;background:#0f0f0f;color:white;font-family:Arial;text-align:center}
  .box{padding:40px 20px}
  h1{font-size:50px;margin:10px 0;color:#ff2d55}
  h2{font-weight:300;color:#ccc}
  .player{background:#1e1e1e;border-radius:20px;padding:30px;max-width:500px;margin:30px auto}
  audio{width:100%;margin-top:15px}
  .live{background:red;color:white;padding:5px 15px;border-radius:20px;font-weight:bold}
  .btn{background:#ff2d55;color:white;border:0;padding:15px 30px;border-radius:50px;font-size:18px;cursor:pointer;margin-top:15px}
</style>
</head>
<body>
<div class="box">
  <span class="live">● LIVE</span>
  <h1>RADIO SAMAX</h1>
  <h2>Sama X Time - La tua radio</h2>

  <div class="player">
    <p>🎧 Stai ascoltando RadioSamax</p>
    <audio id="radio" controls preload="none">
      <source src="https://s1.free-shoutcast.com:18404/stream" type="audio/mpeg">
    </audio>
    <br>
    <button class="btn" onclick="document.getElementById('radio').play()">▶️ ASCOLTA ORA</button>
    <p style="color:#888;font-size:14px">Se non parte, premi Play nel player sopra</p>
  </div>

  <p>📻 In onda da Mixxx - SamaxTime</p>
  <p style="color:#666">© 2026 RadioSamax</p>
</div>
</body>
</html>
