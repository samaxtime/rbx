<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Radio Samax - LIVE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:16px}
  .top{display:flex;justify-content:space-between;align-items:center;background:#111;border:1px solid #222;border-radius:14px;padding:12px 14px}
  .badge{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.5px}
  .dot{width:10px;height:10px;border-radius:50%;background:#ff2d2d;box-shadow:0 0 12px #ff2d2d;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .card{background:#141414;border:1px solid #222;border-radius:20px;padding:20px;margin-top:14px;text-align:center}
  .vinyl{width:150px;height:150px;margin:14px auto;border-radius:50%;background:radial-gradient(circle,#222 0%,#000 60%,#111 100%);border:4px solid #222;display:flex;align-items:center;justify-content:center;position:relative}
  .vinyl::after{content:"";position:absolute;inset:18px;border-radius:50%;border:1px solid #333}
  .vinyl::before{content:"";position:absolute;inset:38px;border-radius:50%;border:1px dashed #333}
  .label{width:52px;height:52px;background:#e11d48;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;z-index:2;text-align:center;line-height:1.1}
  .spin{animation:gira 3s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  #titoloOnda{font-size:19px;font-weight:900;margin-top:6px}
  #descOnda{color:#aaa;font-size:13px;margin-top:4px}
  #stato{font-size:12px;color:#888;margin-top:8px}
  #playBtn{background:#e11d48;color:#fff;border:0;padding:14px 26px;border-radius:999px;font-size:17px;font-weight:900;margin-top:16px;cursor:pointer;width:100%}
  #playBtn:active{transform:scale(.98)}
  .vol{margin-top:16px;text-align:left}
  .vol label{font-size:12px;color:#aaa;display:flex;justify-content:space-between}
  .vol input{width:100%;margin-top:6px;accent-color:#e11d48}
  .row{display:flex;gap:10px;margin-top:12px}
  .mini{flex:1;background:#1c1c1c;border:1px solid #262626;border-radius:12px;padding:10px;font-size:12px;color:#aaa}
  .mini b{color:#fff;font-size:15px;display:block}
</style>
</head>
<body>

<div class="top">
  <div class="badge"><span class="dot" id="dot"></span><span id="badgeText">● ON LINE</span></div>
  <div style="font-size:12px;color:#aaa"><span id="listeners">0</span> ascoltatori</div>
</div>

<div class="card">
  <div style="font-size:12px;letter-spacing:2px;color:#e11d48;font-weight:800">IN ONDA ORA</div>
  <div class="vinyl" id="vinyl"><div class="label">SAMAX</div></div>
  <div id="titoloOnda">Radio Samax - LIVE da Caster</div>
  <div id="descOnda">In diretta da Mixxx</div>
  <div id="stato">Premi PLAY per ascoltare</div>

  <button id="playBtn" onclick="toggleRadio()">▶ PLAY</button>

  <div class="vol">
    <label><span>Volume</span><span id="volVal">92%</span></label>
    <input type="range" id="volPubblico" min="0" max="100" value="92" oninput="cambiaVolume(this.value)">
  </div>

  <div class="row">
    <div class="mini">Stato<b id="statoMini">ON LINE</b></div>
    <div class="mini">Sorgente<b>Mixxx / Caster</b></div>
  </div>
</div>

<script>
const ICECAST_URL = "https://morcast.caster.fm:11284/aykN5";
const STATUS_URL = "https://morcast.caster.fm:11284/status-json.xsl";

// AUDIO - FIX: niente <source> dentro, src diretto. Così Safari non si incastra.
const audio = document.createElement('audio');
audio.id = "radio";
audio.preload = "none";
audio.setAttribute("playsinline", "");
audio.src = ICECAST_URL;
document.body.appendChild(audio);

let isPlaying = false;
let liveStartTime = 0;

function cambiaVolume(v){
  document.getElementById('volVal').innerText = v + "%";
  audio.volume = v / 100;
}
audio.volume = 0.92;

function toggleRadio(){
  let btn = document.getElementById('playBtn');
  let vinyl = document.getElementById('vinyl');
  let stato = document.getElementById('stato');

  if(isPlaying){
    audio.pause();
    isPlaying = false;
    btn.innerText = "▶ PLAY";
    vinyl.classList.remove('spin');
    stato.innerText = "In pausa - premi PLAY";
    updateLiveBadge();
    return;
  }

  // FIX: togliamo il ?t= che Caster rifiutava
  btn.innerText = "⏳ COLLEGAMENTO...";
  stato.innerText = "Collegamento a Caster...";
  audio.src = ICECAST_URL;
  audio.load();
  audio.volume = document.getElementById('volPubblico').value / 100;

  audio.play().then(()=>{
    isPlaying = true;
    liveStartTime = Date.now();
    btn.innerText = "⏸ PAUSA";
    vinyl.classList.add('spin');
    stato.innerText = "In diretta - stai ascoltando";
    document.getElementById('titoloOnda').innerText = "Radio Samax - LIVE da Caster";
    document.getElementById('descOnda').innerText = "In diretta da Mixxx";
    updateLiveBadge();
    updateListeners();
  }).catch((e)=>{
    console.log("Play bloccato:", e);
    isPlaying = false;
    btn.innerText = "▶ PLAY";
    vinyl.classList.remove('spin');
    stato.innerText = "Premi di nuovo PLAY (Safari ha bloccato l'audio)";
    alert("⚠️ Safari ha bloccato l'audio. Ricarica la pagina in Safari e ripremi PLAY");
  });
}

function updateLiveBadge(){
  let b = document.getElementById('badgeText');
  let d = document.getElementById('dot');
  let s = document.getElementById('statoMini');
  if(isPlaying){
    b.innerText = "● ON AIR - IN DIRETTA";
    s.innerText = "ON AIR";
    d.style.background = "#22c55e";
    d.style.boxShadow = "0 0 12px #22c55e";
  } else {
    b.innerText = "● ON LINE";
    s.innerText = "ON LINE";
    d.style.background = "#ff2d2d";
    d.style.boxShadow = "0 0 12px #ff2d2d";
  }
}

// Aggiorna titolo e ascoltatori da Caster
async function updateListeners(){
  try{
    let r = await fetch(STATUS_URL);
    let j = await r.json();
    let src = j.icestats.source;
    if(Array.isArray(src)) src = src[0];
    if(src){
      if(src.title) document.getElementById('titoloOnda').innerText = src.title;
      if(src.listeners !== undefined) document.getElementById('listeners').innerText = src.listeners;
      if(src.server_name) document.getElementById('descOnda').innerText = "In diretta da Mixxx - " + src.server_name;
    }
  }catch(e){ console.log("status non letto", e); }
}

setInterval(updateListeners, 10000);
updateListeners();
updateLiveBadge();
</script>
</body>
</html>
