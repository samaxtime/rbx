<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST RADIO SAMAX</title>
<style>
  body{background:#111;color:#fff;font-family:Arial;text-align:center;padding:40px 15px}
  .badge{padding:15px 25px;border-radius:25px;font-weight:900;font-size:20px;display:inline-block}
  .online{background:#00c853;box-shadow:0 0 25px #00c853}
  .offline{background:#333;color:#ff5555}
  .verifica{background:#444;color:#ffcc00}
  button{background:#00c853;color:#fff;border:none;padding:15px 30px;border-radius:30px;font-size:18px;font-weight:800;margin-top:20px;cursor:pointer;width:100%;max-width:400px}
  button.stop{background:#ff1e1e}
  #debug{color:#888;font-size:12px;margin-top:15px}
</style>
</head>
<body>
<h1>TEST RADIO SAMAX</h1>
<div id="stato" class="badge verifica">● VERIFICA...</div>
<br>
<div id="debug">Avvio controllo...</div>
<br>
<audio id="audio" preload="none"></audio>
<button id="btn" onclick="toggle()">▶️ ASCOLTA</button>

<script>
const STREAM = "https://s1.free-shoutcast.com/stream/18404";
const HOST = "http://s1.free-shoutcast.com:18404/7.html";
let suona = false;
let online = false;
let inCorso = false;

// Controllo più veloce: 5 proxy in gara, vince il primo che risponde
async function check(){
  if(inCorso) return;
  inCorso = true;
  let base = HOST + "?x=" + Date.now();
  let proxies = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(base),
    "https://corsproxy.io/?url=" + encodeURIComponent(base),
    "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(base),
    "https://api.cors.lol/?url=" + encodeURIComponent(base),
    "https://api.allorigins.win/get?url=" + encodeURIComponent(base)
  ];
  let risultato = await new Promise((res)=>{
    let fatto = false;
    let cont = 0;
    proxies.forEach(u=>{
      fetch(u, {cache:"no-store"}).then(r=>r.text()).then(t=>{
        if(fatto) return;
        if(t.trim().startsWith("{") && t.includes("contents")){
          try{ t = JSON.parse(t).contents || ""; }catch(e){}
        }
        t = t.replace(/<[^>]*>/g,"").trim().split("\n")[0];
        let p = t.split(",");
        if(p.length >= 2 && (p[1]==="1" || p[1]==="0")){
          fatto = true;
          res(p[1]==="1");
        }
      }).catch(()=>{}).finally(()=>{
        cont++;
        if(cont===proxies.length && !fatto) res(null);
      });
    });
    setTimeout(()=>{ if(!fatto){ fatto=true; res(null); } }, 3000);
  });

  if(risultato === null){
    document.getElementById('debug').textContent = "Proxy lenti... riprovo - " + new Date().toLocaleTimeString('it-IT');
    inCorso = false;
    return; // non cambiare stato se non so
  }
  online = risultato;
  aggiorna();
  inCorso = false;
}

function aggiorna(){
  let s = document.getElementById('stato');
  let b = document.getElementById('btn');
  if(suona){
    s.textContent = "● IN ONDA - LIVE";
    s.className = "badge online";
    b.textContent = "⏹️ STOP";
    b.className = "stop";
    return;
  }
  if(online){
    s.textContent = "● IN ONDA - LIVE";
    s.className = "badge online";
    b.textContent = "▶️ ASCOLTA";
    b.className = "";
    document.getElementById('debug').textContent = "Mixxx ON - " + new Date().toLocaleTimeString('it-IT');
  } else {
    s.textContent = "● RADIO SPENTA";
    s.className = "badge offline";
    b.textContent = "▶️ PROVA AD ASCOLTARE";
    b.className = "";
    document.getElementById('debug').textContent = "Mixxx OFF - " + new Date().toLocaleTimeString('it-IT');
  }
}

function toggle(){
  let a = document.getElementById('audio');
  if(suona){
    a.pause(); a.src=""; suona=false; aggiorna(); check();
  } else {
    a.src = STREAM + "?x=" + Date.now();
    a.play().then(()=>{ suona=true; online=true; aggiorna(); }).catch(e=>{ alert(e.message); });
  }
}
document.getElementById('audio').addEventListener('error', ()=>{
  if(suona){ suona=false; online=false; aggiorna(); }
});

check();
setInterval(check, 2000); // ogni 2 secondi
</script>
</body>
</html>
