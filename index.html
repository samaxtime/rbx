<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SAMAXTIME - Radio</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  .top{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-size:13px;font-weight:700}
  .dot{width:10px;height:10px;border-radius:50%;background:#ff2d2d;display:inline-block;margin-right:6px;box-shadow:0 0 10px #ff2d2d}
  .dot.off{background:#555;box-shadow:none}
  .listeners{color:#888;font-weight:600}
  .card{width:100%;max-width:480px;background:#0f0f0f;border-radius:24px;padding:24px 20px;margin-top:12px;text-align:center}
  .onda{color:#ff2d2d;font-weight:900;letter-spacing:3px;font-size:14px;margin-bottom:14px}
  .vinyl-wrap{position:relative;width:230px;height:230px;margin:0 auto 20px}
  .vinyl{width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle at center,#111 0 2px,#222 2px 4px);border:6px solid #1a1a1a;display:flex;align-items:center;justify-content:center;position:relative}
  .vinyl.playing{animation:spin 2.5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .center{width:72px;height:72px;border-radius:50%;background:#e91e2d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;line-height:1.1}
  .hole{width:10px;height:10px;background:#000;border-radius:50%;position:absolute}
  .btn-play{width:100%;background:#e91e2d;border:none;color:#fff;font-size:20px;font-weight:900;padding:16px;border-radius:999px;cursor:pointer;margin:6px 0 14px}
  .btn-play:active{transform:scale(.98);opacity:.9}
  .vol-row{display:flex;justify-content:space-between;font-size:13px;color:#aaa;margin-bottom:6px}
  input[type=range]{width:100%;accent-color:#e91e2d}
  .info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .box{background:#1a1a1a;border-radius:14px;padding:12px}
  .box small{color:#888;font-size:12px}
  .box b{display:block;margin-top:4px;font-size:15px}
  .msg{font-size:13px;color:#aaa;min-height:18px;margin-top:10px}
</style>
</head>
<body>

<div class="top">
  <span><span id="liveDot" class="dot off"></span> <span id="liveText">ON LINE</span></span>
  <span class="listeners"><span id="listeners">0</span> ascoltatori</span>
</div>

<div class="card">
  <div class="onda">IN ONDA ORA</div>

  <div class="vinyl-wrap">
    <div id="vinyl" class="vinyl">
      <div class="center">SAMAX<br>TIME</div>
      <div class="hole"></div>
    </div>
  </div>

  <button id="playBtn" class="btn-play">▶ &nbsp;PLAY</button>

  <div class="vol-row"><span>Volume</span><span id="volLabel">92%</span></div>
  <input id="vol" type="range" min="0" max="100" value="92">

  <div class="info">
    <div class="box"><small>Stato</small><b id="stato">ON LINE</b></div>
    <div class="box"><small>Sorgente</small><b>Mixxx / Caster</b></div>
  </div>

  <div id="msg" class="msg"></div>
</div>

<!-- Audio creato in HTML, mai con load() -->
<audio id="radio" preload="none" playsinline></audio>

<script>
const STREAM = "https://morcast.caster.fm:11284/aykN5";
const audio = document.getElementById("radio");
const btn = document.getElementById("playBtn");
const vinyl = document.getElementById("vinyl");
const vol = document.getElementById("vol");
const volLabel = document.getElementById("volLabel");
const stato = document.getElementById("stato");
const liveDot = document.getElementById("liveDot");
const msg = document.getElementById("msg");

let isPlaying = false;

// Volume iniziale
audio.volume = 0.92;
vol.addEventListener("input", () => {
  audio.volume = vol.value / 100;
  volLabel.textContent = vol.value + "%";
});

function setPlaying(on){
  isPlaying = on;
  btn.innerHTML = on ? "⏸ &nbsp;PAUSA" : "▶ &nbsp;PLAY";
  vinyl.classList.toggle("playing", on);
  liveDot.classList.toggle("off", !on);
  stato.textContent = on ? "IN ONDA" : "ON LINE";
}

btn.addEventListener("click", async () => {
  if (isPlaying) {
    audio.pause();
    setPlaying(false);
    return;
  }

  msg.textContent = "Connessione...";

  // FIX SAFARI: niente load(), niente fetch a Caster.
  // Si imposta la sorgente solo la prima volta e si fa play() subito dentro il tocco.
  if (!audio.src) {
    audio.src = STREAM;
  }

  try {
    await audio.play();
    setPlaying(true);
    msg.textContent = "Stai ascoltando SAMAXTIME";
  } catch (e) {
    // Safari a volte vuole un secondo tocco, non mostriamo nessun allarme
    msg.textContent = "Premi di nuovo PLAY";
    setPlaying(false);
  }
});

audio.addEventListener("playing", () => {
  setPlaying(true);
  msg.textContent = "Stai ascoltando SAMAXTIME";
});
audio.addEventListener("pause", () => setPlaying(false));
audio.addEventListener("error", () => {
  msg.textContent = "Stream non disponibile, Mixxx è in onda?";
  setPlaying(false);
});
</script>
</body>
</html>
