<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMAXTIME - RBX Radio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px}.logo span{color:#ff2d55}
.live{display:flex;align-items:center;gap:7px;background:#1a1a1a;border:1px solid #333;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:#ff2d55;box-shadow:0 0 10px #ff2d55}
.main{flex:1;width:100%;max-width:480px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.badge{background:#ff2d55;font-size:11px;font-weight:900;letter-spacing:2px;padding:6px 12px;border-radius:999px;margin:8px 0 14px}
h1{font-size:38px;line-height:.95;font-weight:900}h1 span{color:#ff2d55}
.sub{color:#aaa;font-size:14px;margin:8px 0 18px}
.vinyl{width:210px;height:210px;border-radius:50%;background:repeating-radial-gradient(circle at center,#111 0 2px,#000 2px 4px);border:4px solid #222;display:flex;align-items:center;justify-content:center;margin:6px 0 18px}
.center{width:72px;height:72px;border-radius:50%;background:#ff2d55;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;text-align:center;line-height:1.1}
.vinyl.playing{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#playBtn{background:#ff2d55;color:#fff;border:none;width:100%;padding:18px;border-radius:999px;font-size:20px;font-weight:900;cursor:pointer}
#msg{min-height:22px;margin:10px 0;font-size:14px;color:#ffb3c1}
#playerBox{width:100%;display:none;margin-top:10px;background:#111;border:1px solid #222;border-radius:16px;overflow:hidden}
#playerBox iframe{width:100%;height:140px;border:0;display:block}
.casterBtn{display:block;width:100%;text-align:center;margin-top:12px;background:#1a1a1a;border:1px solid #333;color:#fff;text-decoration:none;padding:13px;border-radius:999px;font-size:14px;font-weight:700}
.footer{padding:12px;font-size:11px;color:#666}
</style>
</head>
<body>
<div class="header"><div class="logo">SAMAX<span>TIME</span></div><div class="live"><div class="dot"></div><span>IN ONDA</span></div></div>
<div class="main">
<div class="badge">RBX RADIO • LIVE</div>
<h1>SAMAX<span>TIME</span><br>RBX RADIO</h1>
<p class="sub">Premi PLAY e goditi la musica.</p>
<div class="vinyl" id="vinyl"><div class="center">SAMAX<br>TIME</div></div>
<button id="playBtn">▶ &nbsp;PLAY</button>
<div id="msg"></div>
<div id="playerBox"></div>
<a class="casterBtn" href="https://samaxtime.caster.fm" target="_blank">Apri su Caster ↗</a>
</div>
<div class="footer">© 2026 SAMAXTIME • RBX Radio</div>
<script>
const btn = document.getElementById("playBtn");
const vinyl = document.getElementById("vinyl");
const msg = document.getElementById("msg");
const box = document.getElementById("playerBox");
let aperto = false;

btn.addEventListener("click", () => {
  if (!aperto) {
    // Usa il player UFFICIALE di Caster, quello che funziona con Diretto
    box.innerHTML = '<iframe src="https://samaxtime.caster.fm" allow="autoplay"></iframe>';
    box.style.display = "block";
    btn.innerHTML = "⏸ &nbsp;PAUSA";
    vinyl.classList.add("playing");
    msg.textContent = "Stai ascoltando SAMAXTIME - premi PLAY nel player qui sotto se non parte subito";
    aperto = true;
  } else {
    box.innerHTML = "";
    box.style.display = "none";
    btn.innerHTML = "▶ &nbsp;PLAY";
    vinyl.classList.remove("playing");
    msg.textContent = "";
    aperto = false;
  }
});
</script>
</body>
</html>
