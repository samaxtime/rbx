<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADIO SAMAX - Live</title>
<style>
body { text-align:center; font-family:sans-serif; background: linear-gradient(180deg, #7a0000 0%, #c00000 45%, #4d0000 100%); color:white; padding:20px; margin:0; min-height:100vh; }
h1 { font-size:42px; margin:10px 0 0 0; color:white; text-shadow: 0 3px 0 #7a0000, 0 0 20px rgba(0,0,0,0.5); }
.sottotitolo { color:#ffd9d9; font-size:16px; margin:5px 0 0 0; }
.live-box { display:inline-block; padding:9px 20px; border-radius:30px; background:#1a0000; font-weight:bold; margin:15px 0; font-size:18px; border:2px solid white; }
.dot { display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:8px; vertical-align:middle; }
.green { background:#00ff5a; box-shadow:0 0 12px #00ff5a; }
.red { background:#ff2222; box-shadow:0 0 12px #ff2222; }
.yellow { background:#ffcc00; box-shadow:0 0 12px #ffcc00; }
.vinyl-wrap { position:relative; width:230px; height:230px; margin:12px auto; }
.vinyl { width:230px; height:230px; border-radius:50%; background: repeating-radial-gradient(circle at center, #000 0px, #000 2px, #1a1a1a 3px, #000 4px); box-shadow: 0 0 0 5px #fff, 0 10px 30px rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; }
.vinyl.playing { animation: spin 3s linear infinite; }
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
.label { width:82px; height:82px; border-radius:50%; background:#ff0000; display:flex; align-items:center; justify-content:center; text-align:center; font-size:11px; font-weight:bold; line-height:1.2; color:white; border:3px solid white; }
.hole { width:10px; height:10px; background:white; border-radius:50%; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2; }
.play-btn { margin-top:18px; background:white; color:#c00000; border:none; padding:15px 45px; font-size:22px; font-weight:bold; border-radius:50px; cursor:pointer; box-shadow:0 5px 15px rgba(0,0,0,0.4); }
.small { color:#ffd9d9; font-size:13px; margin-top:6px; }
</style>
</head>
<body>

<h1>🎙️ RADIO SAMAX</h1>
<p class="sottotitolo">La Radio dell'Isola d'Elba</p>

<div class="live-box">
<span id="liveDot" class="dot yellow"></span>
<span id="liveText">Controllo...</span>
</div>

<div class="vinyl-wrap">
  <div id="vinyl" class="vinyl"><div class="label">RADIO<br>SAMAX<br>DJ SAMAX</div></div>
  <div class="hole"></div>
</div>

<button id="playBtn" class="play-btn">▶️ PLAY</button>
<p class="small" id="oraInOnda">Premi PLAY per ascoltare</p>

<audio id="radioAudio" preload="none"><source src="https://s1.free-shoutcast.com/stream/18404" type="audio/mpeg"></audio>
<p class="small">DJ Samax - radiosamax.com</p>

<script>
var audio = document.getElementById('radioAudio');
var vinyl = document.getElementById('vinyl');
var btn = document.getElementById('playBtn');
var ora = document.getElementById('oraInOnda');
var dot = document.getElementById('liveDot');
var txt = document.getElementById('liveText');
var STREAM = 'https://s1.free-shoutcast.com/stream/18404';
var staControllando = false;
var stalloTimer = null;

function mostraLive(online){
  if(online){ dot.className='dot green'; txt.textContent='LIVE - IN ONDA'; txt.style.color='#00ff5a'; }
  else { dot.className='dot red'; txt.textContent='OFFLINE - RADIO SPENTA'; txt.style.color='#ff9999'; }
}

// Questa è la cosa nuova che hai chiesto tu:
function staccaTutto(){
  // Ferma la musica, ferma il vinile, torna a PLAY, torna OFFLINE
  try{ audio.pause(); }catch(e){}
  audio.src = STREAM;
  audio.load();
  vinyl.classList.remove('playing');
  btn.textContent='▶️ PLAY';
  ora.textContent='Mixxx ha staccato ON AIR - Radio spenta';
  mostraLive(false);
}

btn.onclick = function(){
  if(audio.paused){
    // Ricarica lo stream da zero, così se hai riattaccato Mixxx riparte pulito
    audio.src = STREAM + '?t=' + Date.now();
    audio.load();
    audio.play().catch(function(){});
    vinyl.classList.add('playing');
    btn.textContent='⏸️ STOP';
    ora.textContent='Stai ascoltando RADIO SAMAX 🎶';
    mostraLive(true);
  } else {
    try{ audio.pause(); }catch(e){}
    vinyl.classList.remove('playing');
    btn.textContent='▶️ PLAY';
    ora.textContent='Premi PLAY per ascoltare';
    checkLive();
  }
};

audio.addEventListener('playing', function(){
  if(stalloTimer) clearTimeout(stalloTimer);
  mostraLive(true);
  vinyl.classList.add('playing');
  btn.textContent='⏸️ STOP';
  ora.textContent='Stai ascoltando RADIO SAMAX 🎶';
});

// Se l'audio si blocca da solo perché hai staccato ON AIR in Mixxx
audio.addEventListener('error', function(){ if(!audio.paused) staccaTutto(); });
audio.addEventListener('ended', function(){ staccaTutto(); });
audio.addEventListener('emptied', function(){ if(!audio.paused) staccaTutto(); });

// Se si ferma per più di 3 secondi mentre dovrebbe suonare = hai staccato
audio.addEventListener('stalled', function(){
  if(stalloTimer) clearTimeout(stalloTimer);
  stalloTimer = setTimeout(function(){
    if(!audio.paused) staccaTutto();
  }, 3000);
});
audio.addEventListener('waiting', function(){
  if(stalloTimer) clearTimeout(stalloTimer);
  stalloTimer = setTimeout(function(){
    if(!audio.paused) staccaTutto();
  }, 3000);
});

function checkLive(){
  if(staControllando) return;
  staControllando = true;

  // Ora controllo SEMPRE, anche se stai ascoltando.
  // Uso fetch, non un secondo audio, così non fa rumori.
  var controller = new AbortController();
  var timeout = setTimeout(function(){ try{ controller.abort(); }catch(e){} }, 2500);
  var arrivato = false;

  fetch(STREAM + '?check=' + Date.now(), { signal: controller.signal, cache: 'no-store' })
  .then(function(res){
    if(!res.body) throw new Error('no body');
    var reader = res.body.getReader();
    return reader.read().then(function(r){
      if(r.value && r.value.length > 0) arrivato = true;
      try{ controller.abort(); }catch(e){}
      try{ reader.cancel(); }catch(e){}
    });
  })
  .then(function(){
    clearTimeout(timeout);
    staControllando = false;
    if(arrivato){
      mostraLive(true);
      // Se eri in PLAY ma si era fermato, non farlo ripartire da solo, aspetta che premi PLAY
    } else {
      // Stream morto = hai staccato ON AIR in Mixxx
      if(!audio.paused){
        staccaTutto();
      } else {
        mostraLive(false);
      }
    }
  })
  .catch(function(){
    clearTimeout(timeout);
    staControllando = false;
    if(arrivato){
      mostraLive(true);
    } else {
      if(!audio.paused){
        staccaTutto();
      } else {
        mostraLive(false);
      }
    }
  });
}

checkLive();
setInterval(checkLive, 5000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkLive(); });
</script>
</body>
</html>
